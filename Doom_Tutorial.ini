description.Spanish=Doom - Tutorial\n\nEsta misión es la adaptación del tutorial oficial para aprender a jugar usando la aplicación Valkyrie, ya que algunas reglas cambian respecto al juego original.\n\n--------------------------------------------------------------------\n <b>Se utiliza un <i>mod</i> de Doom 2016. Puedes encontrarlo en la sección de "Mi colección" de Valkyrie.</b> \n\nGracias a Neuntöter por su gran trabajo con el <i>mod</i> de Doom 2016 para Valkyrie y a Quantumrunner por facilitar su instalación en la aplicación.\n------------------------------------------------------------------------\n Para aprender a usar el editor, te recomiendo este vídeo en español: \n https://www.youtube.com/watch?v=qeKg9p5WkQM \n
description.English=DooM - A digital adaptation of the official tutorial mission to use the app and check some minor changes in rules that are applied on Valkyrie.. \n\n--------------------------------------------------------------------\nThis level uses a special Doom 2016 mod. You can find it at:\nDoom-Valkyrie.ddns.net\nor\nhttps://boardgamegeek.com/filepage/253899/valkyrie-mod\n\nRunning this scenario without installing Doom mod will make Valkyrie app crash and close. Please, install the mod first and activate it on your collection. An installation video is provided with the download files.
